# 1Password stays authoritative; the OS keyring caches secrets across shell sessions.
# Keep the project name stable to preserve existing Atlassian cache entries.
# A stale cache entry is refreshed on the next read, after at most 30 days.
[project]
name = "nushell-atlassian"
revision = "1.0"

[providers]
local_cache = "keyring://secretspec/cache/{project}/{profile}/{key}"
remote = { uri = "onepassword://Work", cache = { provider = "local_cache", max_age = "30d" } }
personal = { uri = "onepassword://Personal", cache = { provider = "local_cache", max_age = "30d" } }

[profiles.default.defaults]
providers = ["remote"]

[profiles.default]
ATLASSIANUSERNAME = { ref = { item = "Atlassian - Work", field = "username" } }
JIRABASEURL = { ref = { item = "Atlassian - Work", field = "Base URL" } }
JIRAAPIKEY = { ref = { item = "Atlassian - Work", field = "Scripting - Jira" } }
BITBUCKETAPIKEY = { ref = { item = "Atlassian - Work", field = "Scripting - BitBucket" } }
VULTR_API_KEY = { ref = { item = "Vultr", field = "API Key" }, providers = ["personal"] }